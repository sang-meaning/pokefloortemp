<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>관리자 · PokeFloor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/pages.css?v=__V__">
  <link rel="stylesheet" href="/admin.css?v=__V__">
</head>
<body>
  <main class="page">
    <h1>⚙ 포켓몬 관리</h1>
    <p class="sub">게임과 도감에 등장할 포켓몬을 PokéAPI에서 추가하거나 끌 수 있어요. 끈 포켓몬은 카드 게임과 도감에 나오지 않아요.</p>

    <section class="panel admin-dungeon">
      <b>⚔ 던전 난이도</b>
      <span class="msg">모든 바이옴에서</span>
      <button class="btn small" id="dg-unlock">전부 해금 (ABYSS 포함)</button>
      <button class="btn small ghost" id="dg-reset">진행도 초기화</button>
      <span id="dg-msg" class="msg"></span>
    </section>

    <section class="panel admin-forms">
      <form id="add-one" class="row">
        <strong>번호로 추가</strong>
        <input type="number" id="one-id" min="1" placeholder="도감 번호 (예: 152)" required>
        <button class="btn" type="submit">추가</button>
      </form>
      <form id="add-range" class="row">
        <strong>범위로 추가</strong>
        <input type="number" id="range-from" min="1" placeholder="시작 (예: 152)" required>
        <span>~</span>
        <input type="number" id="range-to" min="1" placeholder="끝 (예: 251)" required>
        <button class="btn" type="submit">한꺼번에 추가</button>
        <span class="hint">2세대 152~251 · 3세대 252~386</span>
      </form>
      <div id="import-status" class="msg"></div>
      <div class="progress hidden" id="import-progress"><i></i></div>
    </section>

    <section class="panel admin-toolbar">
      <input type="search" id="filter" placeholder="이름·번호·타입 검색">
      <label><input type="checkbox" id="only-inactive"> 꺼진 것만</label>
      <span id="count" class="msg"></span>
    </section>

    <div id="list" class="grid"></div>

    <h1 id="items" class="items-title">🎒 아이템·배지 지급</h1>
    <p class="sub">몬스터볼·진화 도구·회복약·나무열매·지닌 물건(PokéAPI)과 관동 배지. 아직 게임에서 얻는 방법이 없어서 여기서 인벤토리에 넣어 줘요.</p>
    <section class="panel admin-toolbar">
      <input type="search" id="item-filter" placeholder="아이템 이름 검색">
      <select id="item-kind"></select>
      <label><input type="checkbox" id="item-owned"> 가진 것만</label>
      <span id="item-count" class="msg"></span>
      <button class="btn small ghost" id="item-import" title="PokéAPI 에서 아이템 목록 다시 받기 (없는 것만 추가)">↻ 목록 다시 받기</button>
    </section>
    <div class="progress hidden" id="item-progress"><i></i></div>
    <div id="item-list" class="grid item-grid"></div>
  </main>

  <script src="/common.js?v=__V__"></script>
  <script src="/admin.js?v=__V__"></script>
  <script src="/admin-items.js?v=__V__"></script>
</body>
</html>
