<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>오늘의 던전 · PokeFloor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/pages.css">
  <link rel="stylesheet" href="/dungeon.css">
</head>
<body>
  <!-- 로비: 바이옴 3개 중 하나, 파티 1~3마리, 가져갈 아이템 -->
  <main class="page lobby" id="lobby">
    <div class="lobby-head">
      <div>
        <h1>⚔ 오늘의 던전</h1>
        <p class="sub" id="today-sub"></p>
      </div>
      <div class="rules">
        <b>3분</b> 버티면 <b>관장의 보스</b> 등장 · 강화는 입장·1분·2분·보스 직전 4번<br>
        보스를 쓰러뜨리면 <b>몬스터볼</b>로 잡을 수 있어요 · 몬스터 처치 → 💰 골드
      </div>
    </div>

    <section id="starter" class="panel hidden">
      <h2>처음이네요! 함께할 포켓몬을 골라요</h2>
      <div class="starter-list" id="starter-list"></div>
    </section>

    <h2 class="step">1. 바이옴 고르기</h2>
    <div class="biome-pick" id="biome-pick"></div>

    <h2 class="step">2. 파티 (최대 3마리 · 첫 번째가 리더)</h2>
    <div class="party-slots" id="party-slots"></div>
    <div class="party-list" id="party-list"></div>

    <h2 class="step">3. 가져갈 도구</h2>
    <div class="bring" id="bring"></div>
    <div class="ball-note" id="ball-note"></div>

    <div class="go-row">
      <span id="go-msg" class="msg"></span>
      <button class="btn go" id="go" disabled>출격!</button>
    </div>
  </main>

  <!-- 전투 -->
  <div id="game" class="game hidden">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="timeline"><i id="tl-fill"></i>
          <span style="left:33.3%"></span><span style="left:66.6%"></span><b class="boss-mark">👑</b>
          <em id="tl-text">0:00</em>
        </div>
      </div>
      <div class="hud-left">
        <div class="hpbar"><i id="hp-fill"></i><em id="hp-text"></em></div>
        <div class="party-hud" id="party-hud"></div>
        <div class="buffs" id="buffs"></div>
      </div>
      <div class="hud-right">
        <div class="gold" id="gold">💰 0</div>
        <div class="kills" id="kills">처치 0</div>
        <button class="mute" id="mute" title="소리">🔊</button>
      </div>
      <div class="potions" id="potions"></div>
      <div class="bossbar hidden" id="bossbar">
        <div class="bb-name" id="bb-name"></div>
        <div class="bb-track"><i id="bb-lag"></i><i id="bb-fill"></i></div>
      </div>
      <div class="banner hidden" id="banner"></div>
      <div class="controls-hint" id="controls-hint">WASD·방향키 또는 화면을 끌어서 이동 · 공격은 자동 · 1~3 상처약 · Esc 일시정지</div>
    </div>

    <!-- 강화 고르기 -->
    <div class="overlay hidden" id="pick">
      <div class="pick-box">
        <h2 id="pick-title">강화를 골라요</h2>
        <p id="pick-sub"></p>
        <div class="pick-cards" id="pick-cards"></div>
      </div>
    </div>

    <!-- 경고 -->
    <div class="warning hidden" id="warning">
      <div class="warn-stripe"></div>
      <div class="warn-text">⚠ WARNING ⚠</div>
      <div class="warn-sub" id="warn-sub"></div>
      <div class="warn-stripe"></div>
    </div>

    <!-- 일시정지 -->
    <div class="overlay hidden" id="pause">
      <div class="pick-box small">
        <h2>일시정지</h2>
        <button class="btn" id="resume">계속하기</button>
        <button class="btn ghost" id="giveup">포기하기</button>
      </div>
    </div>

    <!-- 포획 -->
    <div class="capture hidden" id="capture">
      <div class="cap-stage">
        <div class="cap-glow"></div>
        <img id="cap-boss" class="cap-boss" alt="">
        <img id="cap-ball" class="cap-ball hidden" alt="">
        <div class="cap-burst" id="cap-burst"></div>
      </div>
      <div class="cap-panel">
        <h2 id="cap-title"></h2>
        <p id="cap-sub"></p>
        <div class="cap-balls" id="cap-balls"></div>
        <button class="btn ghost" id="cap-skip">그냥 보내 주기</button>
      </div>
    </div>

    <!-- 결과 -->
    <div class="overlay hidden" id="result">
      <div class="result-box">
        <h2 id="res-title"></h2>
        <div class="res-gold" id="res-gold"></div>
        <div class="res-exp" id="res-exp"></div>
        <div class="res-caught" id="res-caught"></div>
        <div class="res-actions">
          <a class="btn" href="/dungeon.html">던전 로비로</a>
          <a class="btn ghost" href="/">🏝 베이스캠프로</a>
          <a class="btn ghost" href="/shop.html">🏪 상점</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/biomes.js"></script>
  <script src="/dungeon-fx.js"></script>
  <script src="/dungeon-engine.js"></script>
  <script src="/dungeon.js"></script>
</body>
</html>
