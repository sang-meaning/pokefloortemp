spring.application.name=pokefloor
server.port=8080
pokeapi.base-url=https://pokeapi.co/api/v2

# H2 파일 DB: 프로젝트 폴더의 data/pokefloor.mv.db 에 저장 (설치 불필요)
spring.datasource.url=jdbc:h2:file:./data/pokefloor
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 처음 실행할 때 DB 가 비어 있으면 PokéAPI 에서 받아올 도감 번호 범위 (1세대)
pokefloor.seed.from=1
pokefloor.seed.to=493
