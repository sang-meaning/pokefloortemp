plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pokefloor'
version = '0.0.1-SNAPSHOT'
description = 'Floor796 스타일 포켓몬 아이소메트릭 방'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// js·css 주소 뒤에 빌드 시각을 붙여서(?v=…) 업데이트하면 브라우저가 옛 파일을 섞어 쓰지 않게
tasks.named('processResources') {
    def assetVersion = String.valueOf(System.currentTimeMillis())
    inputs.property('assetVersion', assetVersion)
    filesMatching('**/static/*.html') {
        filter { line -> line.replace('__V__', assetVersion) }
    }
}
